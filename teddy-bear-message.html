<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teddy Bear Hug</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f8ff;
            margin: 0;
            flex-direction: column;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .teddy-bears {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            margin-bottom: 20px;
        }
        .teddy {
            width: 150px;
            height: 150px;
            background-color: brown;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s ease-in-out;
        }
        .teddy.female {
            background-color: pink;
        }
        .text {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }
        .button-container {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            margin: 10px;
        }
        .no {
            background-color: red;
            color: white;
        }
        .yes {
            background-color: green;
            color: white;
        }
        .message {
            font-size: 30px;
            margin-top: 30px;
            visibility: hidden;
        }
        .hugging {
            transform: scale(1.2);
        }
        .kiss {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: pink;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="teddy-bears">
            <div class="teddy male">Teddy 1</div>
            <div class="teddy female">Teddy 2</div>
        </div>
        <div class="text">Do you love me?</div>
        <div class="button-container">
            <button class="yes" onclick="loveAnswer(true)">Yes</button>
            <button class="no" id="noButton" onclick="loveAnswer(false)">No</button>
        </div>
        <div class="message" id="message">I knew it!</div>
        <div class="kiss" id="kiss">💋</div>
    </div>

    <script>
        const noButton = document.getElementById('noButton');
        const message = document.getElementById('message');
        const kiss = document.getElementById('kiss');
        const maleTeddy = document.querySelector('.teddy.male');
        const femaleTeddy = document.querySelector('.teddy.female');
        
        let isHugging = false;
        
        // Function to handle the button click interactions
        function loveAnswer(answer) {
            if (answer) {
                displayLoveAnimation();
            } else {
                moveNoButton();
            }
        }

        // Function to display the animation for Yes
        function displayLoveAnimation() {
            message.style.visibility = 'visible';
            maleTeddy.classList.add('hugging');
            femaleTeddy.classList.add('hugging');
            
            // Delay for the kiss animation after the hug
            setTimeout(() => {
                kiss.style.visibility = 'visible';
                setTimeout(() => {
                    kiss.style.visibility = 'hidden';
                }, 2000);
            }, 1500);
        }

        // Function to move the "No" button to a random position
        function moveNoButton() {
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            noButton.style.position = 'absolute';
            noButton.style.left = x + 'px';
            noButton.style.top = y + 'px';
        }
    </script>

</body>
</html>
